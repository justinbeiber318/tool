name: vnu_course_mobile
description: Phase 1 Flutter WebView PoC for VNU course registration.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  wakelock_plus: ^1.7.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.0
  webview_flutter_platform_interface: ^2.15.1
  webview_flutter_wkwebview: ^3.26.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
